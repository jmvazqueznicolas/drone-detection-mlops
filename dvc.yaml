stages:
  prepare_data:
    cmd: python src/data/make_dataset.py --raw_data data/raw/drones_v1 
      --processed_data data/processed/drones_dataset --classes airplane bird drone --split 0.7 0.2 0.1
    deps:
    - data/raw/
    - src/data/make_dataset.py
    outs:
    - data/processed/
  
  train_model:
    cmd: python src/train/train.py --data_yaml data/processed/drones_dataset/dataset.yaml --epochs 100 --n_trials 30 --model_output models/best.pt
    deps:
    - data/processed/
    - src/train/train.py
    outs:
    - models/best.pt
